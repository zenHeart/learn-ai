<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1236" width="100%" height="100%" role="img" aria-labelledby="t3-seq-title t3-seq-desc">
  <title id="t3-seq-title">T3 Code: how your message becomes one agent turn, and how a permission request comes back to you</title>
  <desc id="t3-seq-desc">This sequence diagram answers two questions in numbered order: after you send a message in the interface, which stages does it pass through before it becomes one agent turn, and when the agent asks for permission, how does that request reach you and how does your decision get back to it? The diagram has six columns. The first is you: the desktop, web, or mobile client. The next three belong to the T3 Code server: the Orchestrator only decides events and effects and does no input or output; the EventSink writes to the database; the EffectWorker runs effects after commit. The fifth column is the Provider adapter, which translates T3 Code's operations and events into each agent's protocol. The sixth is the external agent process, for example the Claude Code or Codex command-line process. Solid lines are commands or calls; dashed lines are events, notices, and returns. Step 1: you send a command over authenticated RPC. Step 2: the Orchestrator decides the events plus one effect, which starts a provider turn. Step 3: the EventSink writes the events, projections, command receipt, and pending effect in one database transaction. Only after commit are subscribers told, which is when your message appears in the client. Step 4: the EffectWorker picks up the effect after commit and calls the Provider adapter. Step 5: the adapter calls startTurn on the external agent process with the policy for the permission mode, and the agent starts. Step 6: the agent process emits events; the adapter translates them into unified events, which go back to the Orchestrator as commands, are stored, and are pushed to the client as text deltas and tool calls. Step 7: when the agent process requests permission, the adapter first checks the permission mode: allow or deny is answered at once; only ask creates a pending request, called a runtime_request, which appears in the thread. Step 8: you approve or reject, and the client sends a response command; the Orchestrator marks the request resolved and stores it; the EffectWorker calls the adapter's respondToRuntimeRequest, the decision goes back to the agent process, and the agent continues. Three relationships to remember: the interface never talks to the agent directly, and every client reaches the server over authenticated RPC; each provider's differences stay behind the adapter, and the Orchestrator and the interface read only the capabilities the adapter declares; approvals and messages share one channel, both are stored before they are delivered, so approving on the phone and approving on the computer is the same flow. This diagram leaves out the concrete interface and buttons, the internal steps of model inference, and the T3 Connect relay, which is not on the path of business data. T3 Code does not run a model itself.</desc>

  <defs>
    <linearGradient id="t3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="t3Grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <filter id="t3Shadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="t3Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'SF Pro SC', system-ui, sans-serif; }
      .t-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .t-sub { fill: #94a3b8; font-size: 12px; }
      .t-note { fill: #94a3b8; font-size: 10.5px; }
      .t-card { fill: #f8fafc; font-size: 13.5px; font-weight: 700; }
      .t-body { fill: #cbd5e1; font-size: 11px; }
      .t-cap { fill: #fdba74; font-size: 10.5px; font-weight: 600; }
      .t-num { fill: #0f172a; font-size: 11px; font-weight: 700; }
      .t-group { fill: #c4b5fd; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }
    </style>
  </defs>

  <rect width="1020" height="1236" fill="url(#t3Bg)"/>
  <rect width="1020" height="1236" fill="url(#t3Grid)"/>

  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="8" height="38" rx="4" fill="#a78bfa"/>
    <text x="20" y="21" class="t-title">How your message becomes one agent turn</text>
    <text x="20" y="40" class="t-sub">Numbers give the order. Solid lines are commands or calls; dashed lines are events, notices and returns. Every step is stored before it is delivered</text>
  </g>

  <!-- T3 Code server: the middle three columns share one server -->
  <rect x="186" y="106" width="484" height="1018" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="7 5" opacity="0.7"/>
  <text x="196" y="99" class="t-group">T3 Code server</text>

  <!-- Six lanes -->
  <g>
    <rect x="30" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="194" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="358" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="522" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="686" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="850" y="118" width="140" height="1000" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
  </g>

  <!-- Lane headers -->
  <g>
    <rect x="30" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="30" y="118" width="140" height="58" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#22d3ee" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="100" y="142" class="t-card" text-anchor="middle">You</text>
    <text x="100" y="162" class="t-note" text-anchor="middle">desktop, web, mobile</text>

    <rect x="194" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="194" y="118" width="140" height="58" rx="9" fill="rgba(76, 29, 149, 0.45)" stroke="#a78bfa" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="264" y="142" class="t-card" text-anchor="middle">Orchestrator</text>
    <text x="264" y="162" class="t-note" text-anchor="middle">plans events and effects</text>

    <rect x="358" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="358" y="118" width="140" height="58" rx="9" fill="rgba(76, 29, 149, 0.45)" stroke="#a78bfa" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="428" y="142" class="t-card" text-anchor="middle">EventSink</text>
    <text x="428" y="162" class="t-note" text-anchor="middle">one transaction</text>

    <rect x="522" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="522" y="118" width="140" height="58" rx="9" fill="rgba(76, 29, 149, 0.45)" stroke="#a78bfa" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="592" y="142" class="t-card" text-anchor="middle">EffectWorker</text>
    <text x="592" y="162" class="t-note" text-anchor="middle">effects after commit</text>

    <rect x="686" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="686" y="118" width="140" height="58" rx="9" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="756" y="142" class="t-card" text-anchor="middle">Provider adapter</text>
    <text x="756" y="162" class="t-note" text-anchor="middle">translates protocols</text>

    <rect x="850" y="118" width="140" height="58" rx="9" fill="#0f172a"/>
    <rect x="850" y="118" width="140" height="58" rx="9" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5" filter="url(#t3Shadow)"/>
    <text x="920" y="142" class="t-card" text-anchor="middle">Agent process</text>
    <text x="920" y="162" class="t-note" text-anchor="middle">e.g. Claude Code, Codex</text>
  </g>

  <!-- 1 You send a command -->
  <line x1="100" y1="216" x2="258" y2="216" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <circle cx="118" cy="204" r="9" fill="#38bdf8"/>
  <text x="118" y="208" class="t-num" text-anchor="middle">1</text>
  <text x="134" y="208" class="t-cap">Send a command</text>
  <text x="134" y="233" class="t-note">over authenticated RPC</text>

  <!-- 2 The Orchestrator decides events and an effect -->
  <rect x="200" y="256" width="128" height="78" rx="7" fill="#0f172a"/>
  <rect x="200" y="256" width="128" height="78" rx="7" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <circle cx="212" cy="248" r="9" fill="#a78bfa"/>
  <text x="212" y="252" class="t-num" text-anchor="middle">2</text>
  <text x="264" y="278" class="t-body" text-anchor="middle">Decides the events,</text>
  <text x="264" y="296" class="t-body" text-anchor="middle">plus one effect:</text>
  <text x="264" y="314" class="t-body" text-anchor="middle">start a provider turn</text>

  <!-- 3 One transaction; subscribers are told only after commit -->
  <line x1="264" y1="372" x2="422" y2="372" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <circle cx="282" cy="360" r="9" fill="#a78bfa"/>
  <text x="282" y="364" class="t-num" text-anchor="middle">3</text>
  <text x="298" y="364" class="t-cap">Written in one transaction</text>
  <text x="298" y="389" class="t-note">events, projections, receipt, effect</text>
  <line x1="428" y1="420" x2="106" y2="420" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <text x="412" y="412" class="t-cap" text-anchor="end">Only after commit are subscribers told, so your message appears</text>

  <!-- 4 The effect runs after commit and calls the adapter -->
  <line x1="428" y1="470" x2="586" y2="470" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <circle cx="446" cy="458" r="9" fill="#a78bfa"/>
  <text x="446" y="462" class="t-num" text-anchor="middle">4</text>
  <text x="462" y="462" class="t-cap">Effect picked up after commit</text>
  <line x1="592" y1="514" x2="750" y2="514" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="610" y="506" class="t-cap">Calls the adapter</text>

  <!-- 5 The adapter calls the external agent process -->
  <line x1="756" y1="558" x2="914" y2="558" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <circle cx="774" cy="546" r="9" fill="#fbbf24"/>
  <text x="774" y="550" class="t-num" text-anchor="middle">5</text>
  <text x="790" y="550" class="t-cap">Calls startTurn with the</text>
  <text x="790" y="575" class="t-note">policy for the permission mode</text>

  <!-- 6 Agent events go back to the Orchestrator, then to the client -->
  <line x1="920" y1="612" x2="762" y2="612" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <circle cx="902" cy="600" r="9" fill="#fbbf24"/>
  <text x="902" y="604" class="t-num" text-anchor="middle">6</text>
  <text x="886" y="604" class="t-cap" text-anchor="end">Agent emits events</text>
  <line x1="756" y1="656" x2="270" y2="656" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="722" y="648" class="t-cap" text-anchor="end">Translated to unified events, sent back as commands and stored</text>
  <line x1="264" y1="700" x2="106" y2="700" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <text x="248" y="692" class="t-cap" text-anchor="end">Pushes text deltas</text>
  <text x="248" y="717" class="t-note" text-anchor="end">and tool calls</text>

  <!-- 7 A permission request is checked against the mode first -->
  <line x1="920" y1="752" x2="762" y2="752" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <circle cx="902" cy="740" r="9" fill="#fbbf24"/>
  <text x="902" y="744" class="t-num" text-anchor="middle">7</text>
  <text x="886" y="744" class="t-cap" text-anchor="end">Requests permission</text>
  <rect x="692" y="780" width="128" height="88" rx="7" fill="#0f172a"/>
  <rect x="692" y="780" width="128" height="88" rx="7" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="756" y="801" class="t-body" text-anchor="middle">Checks the mode:</text>
  <text x="756" y="820" class="t-body" text-anchor="middle">allow / deny: answered</text>
  <text x="756" y="839" class="t-body" text-anchor="middle">at once; ask creates</text>
  <text x="756" y="856" class="t-body" text-anchor="middle">a pending request</text>
  <line x1="756" y1="908" x2="106" y2="908" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <text x="722" y="900" class="t-cap" text-anchor="end">The pending request (runtime_request) appears in the thread</text>

  <!-- 8 Your decision goes back to the agent -->
  <line x1="100" y1="960" x2="258" y2="960" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <circle cx="118" cy="948" r="9" fill="#38bdf8"/>
  <text x="118" y="952" class="t-num" text-anchor="middle">8</text>
  <text x="134" y="952" class="t-cap">Approve or reject</text>
  <text x="134" y="977" class="t-note">send a response command</text>
  <line x1="264" y1="1010" x2="422" y2="1010" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="282" y="1002" class="t-cap">Marked resolved and stored</text>
  <line x1="592" y1="1054" x2="750" y2="1054" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="610" y="1046" class="t-cap">respondToRuntimeRequest</text>
  <line x1="756" y1="1098" x2="914" y2="1098" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="774" y="1090" class="t-cap">Decision returned; agent continues</text>

  <!-- Legend -->
  <text x="36" y="1162" class="t-note">Legend</text>
  <line x1="36" y1="1170" x2="984" y2="1170" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="1190" x2="76" y2="1190" stroke="#fb923c" stroke-width="2" marker-end="url(#t3Arrow)"/>
  <text x="86" y="1194" class="t-note">Solid: commands or calls</text>
  <line x1="236" y1="1190" x2="276" y2="1190" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#t3Arrow)"/>
  <text x="286" y="1194" class="t-note">Dashed: events, notices, returns</text>
  <rect x="36" y="1208" width="16" height="12" rx="3" fill="rgba(76, 29, 149, 0.6)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="60" y="1218" class="t-note">Purple: inside the T3 Code server</text>
  <rect x="300" y="1208" width="16" height="12" rx="3" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="324" y="1218" class="t-note">Amber: the adapter isolates agent differences</text>
  <rect x="580" y="1208" width="16" height="12" rx="3" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.2"/>
  <text x="604" y="1218" class="t-note">Green: external process; T3 Code runs no model</text>
</svg>

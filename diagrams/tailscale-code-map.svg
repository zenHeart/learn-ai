  <rect x="466" y="804" width="16" height="12" rx="3" fill="rgba(76, 29, 149, 0.6)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="490" y="814" class="t-note">紫色：仓库里的守护进程（tailscaled）</text>
  <rect x="760" y="804" width="16" height="12" rx="3" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="784" y="814" class="t-note">琥珀：仓库外的一端</text>
</svg>

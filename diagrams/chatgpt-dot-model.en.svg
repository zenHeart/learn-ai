  <rect x="36" y="648.5" width="16" height="12" rx="3" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="658.5" class="t-leg">Your channels</text>
  <rect x="248" y="648.5" width="16" height="12" rx="3" fill="#0f172a"/>

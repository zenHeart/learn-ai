    <rect x="466" y="326" width="195" height="44" rx="7" fill="rgba(167, 139, 250, 0.1)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="563.5" y="352.9" class="t-card" text-anchor="middle">Custom rules</text>
    <rect x="673" y="326" width="195" height="44" rx="7" fill="#0f172a"/>
    <rect x="673" y="326" width="195" height="44" rx="7" fill="rgba(167, 139, 250, 0.1)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="770.5" y="352.9" class="t-card" text-anchor="middle">Scheduled tasks</text>
  </g>


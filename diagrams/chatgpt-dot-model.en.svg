    <text x="152" y="478.5" class="t-num" text-anchor="middle">3</text>
    <text x="175" y="478.5" class="t-band">What dot can use</text>
    <text x="375" y="478.5" class="t-note">Not all on by default</text>
    <rect x="36" y="490" width="201" height="92" rx="9" fill="#0f172a"/>
    <rect x="36" y="490" width="201" height="92" rx="9" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1.5"/>

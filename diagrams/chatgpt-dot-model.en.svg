  <line x1="352" y1="393" x2="352" y2="483" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dotArrow)"/>
  <line x1="567.5" y1="393" x2="567.5" y2="483" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dotArrow)"/>
  <line x1="783" y1="393" x2="783" y2="483" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dotArrow)"/>
  <line x1="371" y1="431" x2="371" y2="443" stroke="#fb923c" stroke-width="2" marker-end="url(#dotArrow)"/>
  <text x="385" y="441.8" class="t-cap">dot can use each of these</text>

  <!-- 第三层：它能动用的东西 -->
  <g>
    <!-- Label sits in the gap between arrows 1 and 2 so no vertical line crosses it -->

  <rect x="672" y="648.5" width="16" height="12" rx="3" fill="#0f172a"/>
  <rect x="672" y="648.5" width="16" height="12" rx="3" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="696" y="658.5" class="t-leg">Needs approval or setup</text>
  </g>

</svg>

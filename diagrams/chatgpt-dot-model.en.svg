    <text x="136.5" y="542.9" class="t-card" text-anchor="middle">computer &amp; browser</text>
    <text x="136.5" y="558.8" class="t-status s-green" text-anchor="middle">There from the start</text>
    <rect x="251.5" y="490" width="201" height="92" rx="9" fill="#0f172a"/>
    <rect x="251.5" y="490" width="201" height="92" rx="9" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="352" y="523.9" class="t-card" text-anchor="middle">Connected apps</text>
    <text x="352" y="542.9" class="t-card" text-anchor="middle">&amp; plugins</text>
    <text x="352" y="558.8" class="t-status s-amber" text-anchor="middle">You connect them yourself</text>
    <rect x="467" y="490" width="201" height="92" rx="9" fill="#0f172a"/>
    <rect x="467" y="490" width="201" height="92" rx="9" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="567.5" y="516.4" class="t-card" text-anchor="middle">Your own computer</text>
    <text x="567.5" y="535.4" class="t-card" text-anchor="middle">(optional)</text>
    <text x="567.5" y="551.3" class="t-status s-amber" text-anchor="middle">Off by default</text>
    <text x="567.5" y="566.3" class="t-status s-amber" text-anchor="middle">On only after Allow access</text>
    <rect x="682.5" y="490" width="201" height="92" rx="9" fill="#0f172a"/>
    <rect x="682.5" y="490" width="201" height="92" rx="9" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="783" y="523.9" class="t-card" text-anchor="middle">Codex cloud</text>
    <text x="783" y="542.9" class="t-card" text-anchor="middle">environment</text>
    <text x="783" y="558.8" class="t-status s-amber" text-anchor="middle">Create it in Codex first</text>
  </g>

  <!-- 图例 -->
  <g>

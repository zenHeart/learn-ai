    <text x="632" y="163.3" class="t-status s-amber" text-anchor="middle">需你显式授权</text>
    <rect x="724" y="116" width="160" height="68" rx="9" fill="#0f172a"/>
    <rect x="724" y="116" width="160" height="68" rx="9" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="804" y="147.4" class="t-card" text-anchor="middle">Teams</text>
    <text x="804" y="163.3" class="t-status s-amber" text-anchor="middle">需你显式授权</text>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 940" width="100%" height="100%" role="img" aria-labelledby="cindy-arch-title cindy-arch-desc">
  <title id="cindy-arch-title">Cindy：一句任务经过哪几层到达 agent，哪些数据留在你的电脑、哪些会发到云端或模型供应商</title>
  <desc id="cindy-arch-desc">这张分层架构图回答两个问题：一句任务从手机或电脑发出后，经过哪几层才到达 agent 引擎；哪些数据始终留在你的电脑上，哪些会发到 Cindy 的服务或模型供应商。图里有四个区域。左边是你的设备：手机和电脑 B。手机只当遥控器，本地不运行 agent，只经 Cindy 云端的 Device Link 中转连到电脑 A，调用白名单内的通道。电脑 B 既可以当控制端，也可以当被控端。中间是电脑 A 上的 Cindy 客户端，从上到下四层：界面，也就是 Renderer，只向主进程提交意图；主进程，也就是 Main，里面有输入协调器、本地 SQLite 数据库、自动化调度和聊天渠道；会话层，也就是 maker-core，由 Maker 与 Session 把三种 harness 的输出统一成同一种事件流，再回到界面；最下面是 harness 适配层，对应 Claude Code、Codex、Pi 和插件引擎。适配层之下是 harness 子进程，它读写电脑 A 上的文件、浏览器和应用；项目文件留在执行任务的那台电脑。右侧下方是模型供应商，有四类：已有订阅、API key、本地模型和 Cindy 官方模型服务。harness 的模型请求先经过本机回环代理与协议桥接，再由电脑 A 直接发往所选的供应商；只有选官方模型服务时，请求才会经过云端的网关。上方是 Cindy 云端，与本机有关的只有四条连线：第一，设备信息与在线心跳，由电脑发往云端，仅登录模式；第二，使用统计发往 TapDB，默认开，可以关；第三，云伙伴的对话层同步，是双向的；第四，选择官方模型服务时的模型请求。本地模式，也就是跳过登录时，没有心跳，没有使用统计上报，也没有 Device Link。Agent-Net 是 Beta 功能，默认关，画成 Device Link 中转旁的一条可选加密路径。本图省略了服务端的内部模块，因为后端不在开源仓库里；不对官方中继是否会读取数据下结论；不标价格与额度。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="100%" height="100%" role="img" aria-labelledby="ts-map-title ts-map-desc">
  <title id="ts-map-title">Tailscale source map: how one command reaches WireGuard</title>
  <desc id="ts-map-desc">This layered architecture diagram answers one question: after a tailscale command leaves the terminal, which processes and packages does it pass through before it reaches WireGuard, and where do the control plane and the relay attach? From top to bottom: the tailscale command line, whose source lives in cmd/tailscale/cli; the local socket, a Unix socket or a Windows named pipe implemented by safesocket; the LocalAPI HTTP server, made of ipn/ipnserver and ipn/localapi; LocalBackend, in ipn/ipnlocal; wgengine, which contains router, filter, and netstack; magicsock, in wgengine/magicsock; and finally wireguard-go, a dependency outside the repository that sends and receives over UDP. The arrows show the direction of calls and data. The command line sends HTTP requests to the LocalAPI over the local socket, and requests only go from the command line to the daemon. The LocalAPI first checks the caller's permission, read-only or read-write, and then calls LocalBackend. LocalBackend passes the network map and packet filter rules down to wgengine. wgengine hands endpoints and path selection to magicsock. magicsock encrypts and decrypts with wireguard-go. The LocalAPI listens only on the local socket and is never exposed. On the left is the control plane: control/controlclient makes long-polling requests to the coordination server, the coordination server sends the network map back, and controlclient then calls back into LocalBackend; this line carries only public keys, addresses, and policy, and the coordination server is not on the data path. On the right is the relay: magicsock connects to DERP servers through derp and derp/derphttp in order to negotiate connections and to fall back to relaying; DERP relays only encrypted packets. This diagram leaves out the internals of Peer Relay and Tailnet Lock, and the further modules inside each package.</desc>

    <text x="20" y="21" class="t-title">Tailscale source map: how one command reaches WireGuard</text>
    <text x="20" y="40" class="t-sub">The middle column is the call chain inside the repository; the control plane is on the left, the relay on the right, both outside the repository</text>
  </g>

  <rect x="300" y="92" width="360" height="54" rx="9" fill="#0f172a"/>
  <rect x="300" y="92" width="360" height="54" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="115" class="t-card" text-anchor="middle">tailscale CLI</text>
  <text x="480" y="134" class="t-code" text-anchor="middle">cmd/tailscale/cli</text>
  <line x1="480" y1="146" x2="480" y2="192" stroke="#fb923c" stroke-width="2" marker-end="url(#mArrow)"/>
  <text x="494" y="172" class="t-cap">Sends HTTP over the local socket (safesocket)</text>


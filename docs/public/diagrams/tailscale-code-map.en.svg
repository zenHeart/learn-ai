      .t-sub { fill: #94a3b8; font-size: 12px; }
      .t-note { fill: #94a3b8; font-size: 10.5px; }
      .t-card { fill: #f8fafc; font-size: 13.5px; font-weight: 700; }
      .t-body { fill: #cbd5e1; font-size: 11px; }
      .t-code { fill: #7dd3fc; font-size: 10.5px; }
      .t-cap { fill: #fdba74; font-size: 10.5px; font-weight: 600; }
      .t-tag { fill: #fde68a; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

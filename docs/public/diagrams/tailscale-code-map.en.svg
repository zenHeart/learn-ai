  <text x="494" y="456" class="t-cap">Passes down the network map and packet filter rules</text>

  <rect x="300" y="472" width="360" height="84" rx="9" fill="#0f172a"/>
  <rect x="300" y="472" width="360" height="84" rx="9" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="480" y="496" class="t-card" text-anchor="middle">wgengine</text>

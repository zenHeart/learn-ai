<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1008" width="100%" height="100%" role="img" aria-labelledby="ts-conn-title ts-conn-desc">
  <title id="ts-conn-title">Tailscale 建连时序：先登录和交换信息，再经 DERP 牵线，能直连就直连，打不通才回落到中继</title>
  <desc id="ts-conn-desc">这张时序图有五条竖向泳道，从左到右是：设备 A、设备 B、身份提供商、协调服务器（控制面）、DERP 中继服务器（同时充当 STUN 服务器）。编号即顺序。第一步，设备 A 和设备 B 各自向身份提供商登录；Tailscale 自己不做用户认证。第二步，两台设备分别向协调服务器上报 MapRequest，内容是自己的节点公钥、地址和候选端点。第三步，协调服务器向设备 A 和设备 B 下发网络地图 netmap，里面有对方是否存在、对方的节点公钥、Tailscale 地址、候选端点和对方的 home DERP 区域；它只下发策略允许看到的节点。第四步，设备 A 连到设备 B 所在的 DERP 服务器，DERP 把连接请求转给设备 B，随后双方经 DERP 交换直连所需的端点信息；经 DERP 的路径画成琥珀色虚线。第五步，双方先用 STUN 查出自己的公网地址，再逐个尝试候选端点做 NAT 穿透；成功就建立直连的 WireGuard UDP 隧道，画成翠绿色粗线，之后数据不再经过第三方。第六步，如果打不通，先尝试 tailnet 内的 Peer Relay，画成青色虚线；Peer Relay 需要显式设置，不是默认就有；没有可用的 Peer Relay，才继续用 DERP 中继，转发的是已加密的 WireGuard 包，画成琥珀色虚线。第七步，设备上的 Tailscale 周期性重试，看能否升级成直连或 Peer Relay。第八步是两条保护标注：协调服务器只分发公钥与策略，不在数据路径上，看不到明文；DERP 只转发已加密的 WireGuard 包，无法解密。直连与回落的区别：直连时数据只在两台设备之间走，不经过第三方；回落时数据经 Peer Relay 或 DERP 中继转发，其中经 DERP 转发的仍是已加密的 WireGuard 包。橙色实线是控制与协商消息。本图省略了：Peer Relay 没有画成单独的一列；WireGuard 握手与密钥协商的内部步骤；NAT 类型与打洞的具体算法；周期性重试的时间间隔；DERP 区域的数量与位置；协调服务器下发策略的具体内容。</desc>

  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="tsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <filter id="tsShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="mO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker>
    <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
    <style>
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'SF Pro SC', system-ui, sans-serif; }
      .t-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .t-sub { fill: #94a3b8; font-size: 12px; }
      .t-lane { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .t-note { fill: #94a3b8; font-size: 10.5px; text-anchor: middle; }
      .t-band { fill: #cbd5e1; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }
      .t-body { fill: #e2e8f0; font-size: 11px; }
      .t-sm { fill: #94a3b8; font-size: 10.5px; }
      .t-h { fill: #fecdd3; font-size: 12px; font-weight: 700; }
      .t-tag { fill: #fb7185; font-size: 10.5px; font-weight: 700; }
      .t-num { fill: #0f172a; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .t-leg { fill: #cbd5e1; font-size: 10.5px; }
      .ln { fill: rgba(15, 23, 42, 0.62); stroke: rgba(148, 163, 184, 0.22); }
      .bk { fill: #0f172a; }
      .dv { stroke: rgba(148, 163, 184, 0.35); stroke-width: 1; }
      .aO { fill: none; stroke: #fb923c; stroke-width: 1.8; }
      .aG { fill: none; stroke: #34d399; stroke-width: 5.5; }
      .aC { fill: none; stroke: #22d3ee; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .aA { fill: none; stroke: #fbbf24; stroke-width: 1.8; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1020" height="1008" fill="url(#tsBg)"/>
  <rect width="1020" height="1008" fill="url(#tsGrid)"/>

  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="8" height="38" rx="4" fill="#22d3ee"/>
    <text x="20" y="21" class="t-title">Tailscale 建连时序：先牵线，再直连，打不通才回落</text>
    <text x="20" y="40" class="t-sub">编号 1–7 即消息顺序，8 是两条保护标注；每条消息的内容写在箭头上方</text>
  </g>

  <!-- 五条泳道。左三条到步骤 7 为止；右两条向下延伸，底部放步骤 8 的保护标注 -->
  <g class="ln">
    <rect x="37" y="92" width="170" height="802"/>
    <rect x="231" y="92" width="170" height="802"/>
    <rect x="425" y="92" width="170" height="802"/>
    <rect x="619" y="92" width="170" height="896"/>
    <rect x="813" y="92" width="170" height="896"/>
  </g>

  <!-- 泳道标题卡片（双层） -->
  <g>
    <rect x="37" y="92" width="170" height="54" rx="9" fill="#0f172a"/>
    <rect x="37" y="92" width="170" height="54" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#22d3ee" stroke-width="1.5" filter="url(#tsShadow)"/>
    <text x="122" y="115" class="t-lane" fill="#a5f3fc">设备 A</text>
    <text x="122" y="134" class="t-note">发起连接的一方</text>

    <rect x="231" y="92" width="170" height="54" rx="9" fill="#0f172a"/>
    <rect x="231" y="92" width="170" height="54" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#38bdf8" stroke-width="1.5" filter="url(#tsShadow)"/>
    <text x="316" y="115" class="t-lane" fill="#bae6fd">设备 B</text>
    <text x="316" y="134" class="t-note">被连接的一方</text>

    <rect x="425" y="92" width="170" height="54" rx="9" fill="#0f172a"/>
    <rect x="425" y="92" width="170" height="54" rx="9" fill="rgba(51, 65, 85, 0.45)" stroke="#94a3b8" stroke-width="1.5" filter="url(#tsShadow)"/>
    <text x="510" y="115" class="t-lane" fill="#cbd5e1">身份提供商 IdP</text>
    <text x="510" y="134" class="t-note">Tailscale 自己不做用户认证</text>

    <rect x="619" y="92" width="170" height="54" rx="9" fill="#0f172a"/>
    <rect x="619" y="92" width="170" height="54" rx="9" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5" filter="url(#tsShadow)"/>
    <text x="704" y="115" class="t-lane" fill="#fde68a">协调服务器（控制面）</text>
    <text x="704" y="134" class="t-note">coordination server</text>

    <rect x="813" y="92" width="170" height="54" rx="9" fill="#0f172a"/>
    <rect x="813" y="92" width="170" height="54" rx="9" fill="rgba(120, 53, 15, 0.3)" stroke="#f59e0b" stroke-width="1.5" filter="url(#tsShadow)"/>
    <text x="898" y="115" class="t-lane" fill="#fcd34d">DERP 中继服务器</text>
    <text x="898" y="134" class="t-note">同时充当 STUN 服务器</text>
  </g>

  <text x="37" y="180" class="t-band">步骤 1–3：登录、上报、下发网络地图</text>
  <line x1="37" y1="186" x2="983" y2="186" class="dv"/>

  <!-- 1 设备 A、设备 B 各自向身份提供商登录 -->
  <line x1="122" y1="212" x2="510" y2="212" class="aO" marker-end="url(#mO)"/>
  <rect x="230" y="193" width="198" height="14" class="bk"/><text x="235" y="204" class="t-body">登录：Tailscale 自己不做用户认证</text>
  <circle cx="213" cy="200" r="9" fill="#fb923c"/><text x="213" y="204" class="t-num">1</text>
  <line x1="316" y1="246" x2="510" y2="246" class="aO" marker-end="url(#mO)"/>
  <rect x="375" y="227" width="101" height="14" class="bk"/><text x="380" y="238" class="t-body">登录（同设备 A）</text>
  <circle cx="358" cy="240" r="9" fill="#fb923c"/><text x="358" y="244" class="t-num">1</text>

  <!-- 2 上报 MapRequest -->
  <line x1="122" y1="282" x2="704" y2="282" class="aO" marker-end="url(#mO)"/>
  <rect x="305" y="263" width="241" height="14" class="bk"/><text x="310" y="274" class="t-body">MapRequest：上报节点公钥、地址、候选端点</text>
  <circle cx="288" cy="270" r="9" fill="#fb923c"/><text x="288" y="274" class="t-num">2</text>
  <line x1="316" y1="316" x2="704" y2="316" class="aO" marker-end="url(#mO)"/>
  <rect x="451" y="297" width="144" height="14" class="bk"/><text x="456" y="308" class="t-body">MapRequest（同设备 A）</text>
  <circle cx="432" cy="304" r="9" fill="#fb923c"/><text x="432" y="308" class="t-num">2</text>

  <!-- 3 下发网络地图 netmap -->
  <line x1="704" y1="352" x2="316" y2="352" class="aO" marker-end="url(#mO)"/>
  <rect x="461" y="333" width="123" height="14" class="bk"/><text x="466" y="344" class="t-body">下发网络地图 netmap</text>
  <circle cx="444" cy="340" r="9" fill="#fb923c"/><text x="444" y="344" class="t-num">3</text>
  <line x1="704" y1="411" x2="122" y2="411" class="aO" marker-end="url(#mO)"/>
  <rect x="280" y="366" width="292" height="40" class="bk"/>
  <text x="285" y="377" class="t-body">内含：对方是否存在、对方的节点公钥</text>
  <text x="285" y="390" class="t-body">Tailscale 地址、候选端点、对方的 home DERP 区域</text>
  <text x="285" y="403" class="t-sm">只下发策略允许看到的节点</text>
  <circle cx="263" cy="373" r="9" fill="#fb923c"/><text x="263" y="377" class="t-num">3</text>

  <text x="37" y="440" class="t-band">步骤 4：先经 DERP 中继牵线</text>
  <line x1="37" y1="446" x2="983" y2="446" class="dv"/>

  <!-- 4 经 DERP 牵线：先连上、转交连接请求，再交换端点信息 -->
  <line x1="122" y1="472" x2="898" y2="472" class="aO" marker-end="url(#mO)"/>
  <rect x="433" y="453" width="179" height="14" class="bk"/><text x="438" y="464" class="t-body">连到设备 B 所在的 DERP 服务器</text>
  <circle cx="416" cy="460" r="9" fill="#fb923c"/><text x="416" y="464" class="t-num">4</text>
  <line x1="898" y1="506" x2="316" y2="506" class="aO" marker-end="url(#mO)"/>
  <rect x="544" y="487" width="151" height="14" class="bk"/><text x="549" y="498" class="t-body">经 DERP 把连接请求发给设备 B</text>
  <circle cx="527" cy="494" r="9" fill="#fb923c"/><text x="527" y="498" class="t-num">4</text>
  <line x1="123" y1="546" x2="897" y2="546" class="aA" marker-start="url(#mA)" marker-end="url(#mA)"/>
  <line x1="898" y1="546" x2="898" y2="560" class="aA"/>
  <line x1="897" y1="560" x2="317" y2="560" class="aA" marker-start="url(#mA)" marker-end="url(#mA)"/>
  <rect x="421" y="527" width="203" height="14" class="bk"/><text x="426" y="538" class="t-body">双方经 DERP 交换直连所需的端点信息</text>
  <circle cx="404" cy="534" r="9" fill="#fbbf24"/><text x="404" y="538" class="t-num">4</text>

  <text x="37" y="590" class="t-band">步骤 5–7：尝试直连，打不通再回落，并周期性重试</text>
  <line x1="37" y1="596" x2="983" y2="596" class="dv"/>

  <!-- 5 NAT 穿透：STUN 查公网地址，逐个试候选端点，成功则直连 -->
  <line x1="122" y1="622" x2="898" y2="622" class="aO" marker-end="url(#mO)"/>
  <rect x="450" y="603" width="146" height="14" class="bk"/><text x="455" y="614" class="t-body">STUN：查出自己的公网地址</text>
  <circle cx="431" cy="610" r="9" fill="#fb923c"/><text x="431" y="614" class="t-num">5</text>
  <line x1="316" y1="656" x2="898" y2="656" class="aO" marker-end="url(#mO)"/>
  <rect x="547" y="637" width="146" height="14" class="bk"/><text x="552" y="648" class="t-body">STUN：查出自己的公网地址</text>
  <circle cx="528" cy="644" r="9" fill="#fb923c"/><text x="528" y="648" class="t-num">5</text>
  <line x1="122" y1="692" x2="316" y2="692" class="aO" marker-start="url(#mO)" marker-end="url(#mO)"/>
  <rect x="146" y="673" width="171" height="14" class="bk"/><text x="151" y="684" class="t-body">逐个尝试候选端点，做 NAT 穿透</text>
  <circle cx="129" cy="680" r="9" fill="#fb923c"/><text x="129" y="684" class="t-num">5</text>
  <line x1="122" y1="734" x2="316" y2="734" class="aG" marker-start="url(#mG)" marker-end="url(#mG)"/>
  <rect x="122" y="702" width="219" height="27" class="bk"/>
  <text x="127" y="713" class="t-body">成功：建立直连的 WireGuard UDP 隧道</text>
  <text x="127" y="726" class="t-sm">之后数据不再经过第三方</text>
  <circle cx="105" cy="709" r="9" fill="#34d399"/><text x="105" y="713" class="t-num">5</text>

  <!-- 6 打不通：先试 Peer Relay（需显式设置），没有可用的才继续用 DERP 中继 -->
  <line x1="122" y1="778" x2="316" y2="778" class="aC" marker-start="url(#mC)" marker-end="url(#mC)"/>
  <rect x="117" y="746" width="230" height="27" class="bk"/>
  <text x="122" y="757" class="t-body">打不通：先试 tailnet 内的 Peer Relay</text>
  <text x="122" y="770" class="t-sm">Peer Relay 需显式设置，不是默认就有</text>
  <circle cx="100" cy="753" r="9" fill="#22d3ee"/><text x="100" y="757" class="t-num">6</text>
  <line x1="123" y1="814" x2="897" y2="814" class="aA" marker-start="url(#mA)" marker-end="url(#mA)"/>
  <line x1="898" y1="814" x2="898" y2="826" class="aA"/>
  <line x1="897" y1="826" x2="317" y2="826" class="aA" marker-start="url(#mA)" marker-end="url(#mA)"/>
  <rect x="401" y="774" width="243" height="27" class="bk"/>  <text x="406" y="785" class="t-body">没有可用的 Peer Relay：继续用 DERP 中继</text>
  <text x="406" y="798" class="t-tag">只转发已加密的 WireGuard 包</text>
  <circle cx="384" cy="781" r="9" fill="#fbbf24"/><text x="384" y="785" class="t-num">6</text>

  <!-- 7 周期性重试（两台设备各自的自环消息） -->
  <path d="M 122 870 H 182 V 886 H 134" class="aO" marker-end="url(#mO)"/>
  <path d="M 316 870 H 376 V 886 H 328" class="aO" marker-end="url(#mO)"/>
  <rect x="175" y="838" width="174" height="27" class="bk"/>
  <text x="180" y="849" class="t-body">Tailscale 周期性重试</text>
  <text x="180" y="862" class="t-sm">看能否升级成直连或 Peer Relay</text>
  <circle cx="158" cy="845" r="9" fill="#fb923c"/><text x="158" y="849" class="t-num">7</text>

  <!-- 8 两条保护标注（玫红） -->
  <g>
    <rect x="623" y="906" width="162" height="74" rx="9" fill="#0f172a"/>
    <rect x="623" y="906" width="162" height="74" rx="9" fill="rgba(190, 24, 93, 0.2)" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="638" cy="921" r="9" fill="#fb7185"/><text x="638" y="925" class="t-num">8</text>
    <text x="652" y="925" class="t-band" fill="#fcd34d">协调服务器（控制面）</text>
    <text x="632" y="943" class="t-h">不在数据路径上</text>
    <text x="632" y="958" class="t-sm" fill="#e2e8f0">只分发公钥与策略</text>
    <text x="632" y="971" class="t-tag">看不到明文</text>

    <rect x="817" y="906" width="162" height="74" rx="9" fill="#0f172a"/>
    <rect x="817" y="906" width="162" height="74" rx="9" fill="rgba(190, 24, 93, 0.2)" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="832" cy="921" r="9" fill="#fb7185"/><text x="832" y="925" class="t-num">8</text>
    <text x="846" y="925" class="t-band" fill="#fcd34d">DERP 中继</text>
    <text x="826" y="943" class="t-h">无法解密</text>
    <text x="826" y="958" class="t-sm" fill="#e2e8f0">只转发已加密的</text>
    <text x="826" y="971" class="t-tag">WireGuard 包</text>
  </g>

  <!-- 图例 -->
  <text x="37" y="917" class="t-band">图例</text>
  <line x1="37" y1="932" x2="73" y2="932" class="aO" marker-end="url(#mO)"/><text x="85" y="936" class="t-leg">控制与协商消息</text>
  <line x1="318" y1="932" x2="354" y2="932" class="aG" marker-start="url(#mG)" marker-end="url(#mG)"/><text x="364" y="936" class="t-leg">建立后的直连 WireGuard 隧道</text>
  <line x1="38" y1="952" x2="72" y2="952" class="aC" marker-start="url(#mC)" marker-end="url(#mC)"/><text x="85" y="956" class="t-leg">回落：Peer Relay（需显式设置）</text>
  <line x1="318" y1="952" x2="354" y2="952" class="aA" marker-start="url(#mA)" marker-end="url(#mA)"/><text x="364" y="956" class="t-leg">回落：经 DERP 中继</text>
  <rect x="37" y="966" width="40" height="13" rx="6.5" fill="rgba(190, 24, 93, 0.25)" stroke="#fb7185" stroke-width="1.2"/><text x="85" y="976" class="t-leg">保护标注：协调服务器与 DERP 看不到明文</text>
</svg>

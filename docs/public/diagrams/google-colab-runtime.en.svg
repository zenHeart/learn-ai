<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="100%" height="100%" role="img" aria-labelledby="colab-rt-title colab-rt-desc">
  <title id="colab-rt-title">Colab: where your code runs, and what survives a disconnected runtime</title>
  <desc id="colab-rt-desc">This diagram answers two questions: where does your code actually run, and after the runtime disconnects, what is still there and what is gone? Solid lines are relationships that survive a disconnect; dashed lines are the connections and contents that disappear. On the left is the notebook interface in the browser, on your own computer. It holds the cells, the outputs, and the sidebar, and the notebook content is edited here. At the top of the middle are two persistent places: Google Drive, which holds notebook files and data files, and GitHub, which holds notebook copies and cloned repositories. The lines between the interface and Drive, and between the interface and GitHub, are solid double-headed arrows, so they survive a disconnect. Below them is the runtime virtual machine in the cloud, where the code actually runs. Its compute type can be CPU, or switch on demand to GPU or TPU, and the interface can switch the runtime type. Three things inside the runtime disappear when it disconnects, marked with dashed rose boxes: the kernel process and in-memory variables, such as variables and imported modules; the temporary disk, such as installed packages and files uploaded to the runtime; and the mount state. The connection from the interface to the runtime is dashed as well: the interface sends cell code to the runtime, and the runtime sends output back to the interface. After you authorize a mount, the runtime reads from and writes to Drive; this line is dashed because the mount is lost on a disconnect. The runtime can pull a notebook or a repository from GitHub. On the right are the files on your computer: the originals stay on your computer, while the copy uploaded to the runtime sits on the temporary disk and disappears on a disconnect. Secrets hands a key to the code in the runtime after you authorize it. This diagram leaves out Google's internal infrastructure, any specific free-tier numbers, and button or menu names that exist only in particular versions.</desc>
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="55%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <pattern id="cGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/></pattern>
    <marker id="cArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/></marker>
    <style>
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'SF Pro SC', system-ui, sans-serif; }
      .t-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .t-sub { fill: #94a3b8; font-size: 12px; }
      .t-band { fill: #f8fafc; font-size: 12px; font-weight: 700; }
      .t-note { fill: #94a3b8; font-size: 10.5px; }
      .t-card { fill: #f8fafc; font-size: 13.5px; font-weight: 700; }
      .t-body { fill: #cbd5e1; font-size: 11px; }
      .t-tag { fill: #fda4af; font-size: 10.5px; font-weight: 600; }
      .t-cap { fill: #fdba74; font-size: 10.5px; font-weight: 600; }
      .t-green { fill: #6ee7b7; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1020" height="720" fill="url(#cBg)"/>
  <rect width="1020" height="720" fill="url(#cGrid)"/>
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="8" height="38" rx="4" fill="#a78bfa"/>
    <text x="20" y="21" class="t-title">Colab: where your code runs, and what survives a disconnect</text>
    <text x="20" y="40" class="t-sub">Solid lines survive a disconnected runtime; dashed lines are the connections and contents that disappear</text>
  </g>

  <!-- 持久位置：Drive 与 GitHub -->
  <rect x="402" y="130" width="148" height="74" rx="9" fill="#0f172a"/>
  <rect x="402" y="130" width="148" height="74" rx="9" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="476" y="156" class="t-card" text-anchor="middle">Google Drive</text>
  <text x="476" y="176" class="t-body" text-anchor="middle">notebooks, data files</text>
  <text x="476" y="193" class="t-green" text-anchor="middle">still there afterwards</text>
  <rect x="570" y="130" width="148" height="74" rx="9" fill="#0f172a"/>
  <rect x="570" y="130" width="148" height="74" rx="9" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="644" y="156" class="t-card" text-anchor="middle">GitHub</text>
  <text x="644" y="176" class="t-body" text-anchor="middle">copies, cloned repos</text>
  <text x="644" y="193" class="t-green" text-anchor="middle">still there afterwards</text>

  <!-- 界面与 Drive / GitHub：实线，断开后保留 -->
  <path d="M 156 130 V 92 H 644 V 122" fill="none" stroke="#fb923c" stroke-width="2" marker-start="url(#cArrow)" marker-end="url(#cArrow)"/>
  <text x="230" y="87" class="t-cap">Save to GitHub, or load from GitHub</text>
  <path d="M 186 130 V 114 H 476 V 122" fill="none" stroke="#fb923c" stroke-width="2" marker-start="url(#cArrow)" marker-end="url(#cArrow)"/>
  <text x="230" y="109" class="t-cap">Save or open notebooks and data</text>


  <rect x="784" y="372" width="200" height="80" rx="9" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="884" y="398" class="t-card" text-anchor="middle">Files on your computer</text>
  <text x="884" y="418" class="t-body" text-anchor="middle">Originals stay on your computer</text>
  <text x="884" y="435" class="t-green" text-anchor="middle">still there afterwards</text>

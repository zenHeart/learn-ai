  <text x="176" y="213" class="t-body" text-anchor="middle">Cells: code and text</text>
  <text x="176" y="229" class="t-green" text-anchor="middle">Notebook content: still there afterwards</text>
  <rect x="52" y="248" width="248" height="32" rx="6" fill="#0f172a"/>
  <rect x="52" y="248" width="248" height="32" rx="6" fill="rgba(8, 51, 68, 0.5)" stroke="#38bdf8" stroke-width="1"/>
  <text x="176" y="268" class="t-body" text-anchor="middle">Output: results shown under the cells</text>
  <rect x="52" y="292" width="248" height="32" rx="6" fill="#0f172a"/>
  <rect x="52" y="292" width="248" height="32" rx="6" fill="rgba(8, 51, 68, 0.5)" stroke="#38bdf8" stroke-width="1"/>
  <text x="176" y="312" class="t-body" text-anchor="middle">Sidebar: files, secrets</text>
  <text x="176" y="560" class="t-note" text-anchor="middle">The interface is only a window</text>
  <text x="176" y="578" class="t-note" text-anchor="middle">Your code does not run here</text>

  <!-- 云端的运行时虚拟机 -->
  <rect x="396" y="228" width="328" height="392" rx="9" fill="#0f172a"/>
  <rect x="396" y="228" width="328" height="392" rx="9" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="560" y="254" class="t-card" text-anchor="middle">Cloud runtime VM: your code runs here</text>
  <g>
    <rect x="412" y="266" width="92" height="30" rx="6" fill="#0f172a"/>
    <rect x="412" y="266" width="92" height="30" rx="6" fill="rgba(76, 29, 149, 0.6)" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="458" y="285" class="t-body" text-anchor="middle">CPU</text>
    <rect x="514" y="266" width="92" height="30" rx="6" fill="#0f172a"/>
    <rect x="514" y="266" width="92" height="30" rx="6" fill="rgba(76, 29, 149, 0.6)" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="560" y="285" class="t-body" text-anchor="middle">GPU</text>
    <rect x="616" y="266" width="92" height="30" rx="6" fill="#0f172a"/>
    <rect x="616" y="266" width="92" height="30" rx="6" fill="rgba(76, 29, 149, 0.6)" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="662" y="285" class="t-body" text-anchor="middle">TPU</text>
  </g>
  <text x="560" y="314" class="t-note" text-anchor="middle">Runtime type: switch on demand</text>
  <rect x="412" y="326" width="296" height="64" rx="7" fill="#0f172a"/>
  <rect x="412" y="326" width="296" height="64" rx="7" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="560" y="347" class="t-card" text-anchor="middle">Kernel process and memory variables</text>
  <text x="560" y="365" class="t-body" text-anchor="middle">variables, imported modules</text>
  <text x="560" y="381" class="t-tag" text-anchor="middle">gone after a disconnect</text>
  <rect x="412" y="402" width="296" height="64" rx="7" fill="#0f172a"/>
  <rect x="412" y="402" width="296" height="64" rx="7" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="560" y="423" class="t-card" text-anchor="middle">Temporary disk</text>
  <text x="560" y="441" class="t-body" text-anchor="middle">installed packages, files uploaded to the runtime</text>
  <text x="560" y="457" class="t-tag" text-anchor="middle">gone after a disconnect</text>
  <rect x="412" y="478" width="296" height="64" rx="7" fill="#0f172a"/>
  <rect x="412" y="478" width="296" height="64" rx="7" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="560" y="499" class="t-card" text-anchor="middle">Mount state</text>
  <text x="560" y="517" class="t-body" text-anchor="middle">whether Drive is mounted</text>
  <text x="560" y="533" class="t-tag" text-anchor="middle">gone after a disconnect</text>
  <text x="560" y="574" class="t-note" text-anchor="middle">Dashed rose boxes live only on this temporary VM</text>
  <text x="560" y="592" class="t-note" text-anchor="middle">These three exist only on this virtual machine</text>

  <!-- 界面到运行时：虚线，断开后消失 -->
  <line x1="316" y1="281" x2="390" y2="281" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#cArrow)"/>

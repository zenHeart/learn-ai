<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1740" width="100%" height="100%" role="img" aria-labelledby="cindy-seq-title cindy-seq-desc" lang="zh-CN">
  <title id="cindy-seq-title">Cindy：一次任务请求的完整回路，从界面发出到 harness 执行，再回到界面</title>
  <desc id="cindy-seq-desc">这张时序图按编号回答一个问题：你在界面里发出一句话，中间经过哪些对象、按什么顺序到达 harness，结果又怎样回到界面。图里有六条竖向泳道，从左到右是：界面，也就是 Renderer；预加载桥，也就是 preload；主进程，泳道里写着 IPC 处理器和输入协调器两个名字；Maker 与 Session，同属 maker-core；harness 适配器；harness 子进程。本地 SQLite 数据库是第九个对象，画成主进程泳道里的一个标注框。圆标里的数字就是顺序；同一个编号下有几条箭头时，表示这一步经几个对象接力传过去。实线是命令或调用，虚线是事件、广播与返回。第一步，界面经预加载桥调用 maker:send，带着 sessionId 与消息，进入主进程里由 ipcMain.handle 注册的处理器。第二步，主进程把输入交给输入协调器：排队、落库，并检查这个任务有没有正在跑的一轮。第三步，协调器经 Maker 取到或恢复对应的 Session。第四步，Session.send 进入 dispatchSend：确认没有在跑的一轮，为本轮预留一个代号。第五步，Session 调用 handle.send，进入 harness 适配器。第六步，适配器把消息翻译成该 harness 自己的协议，发给子进程：Codex 是 turn/start，Claude Code 是 SDK query，Pi 是 RPC。第七步，子进程执行：调用模型、读写文件、跑命令。第八步，harness 的原始输出送到适配器，适配器把它翻译成统一事件，例如 text、tool_use、tool_result、turn_diff，再送给 Session。第九步，Session 把事件分发给监听者；主进程把消息写入本地 SQLite，并把事件广播回界面。第十步，需要确认的操作以 interaction_request 经 Session 和主进程回到界面，停在界面等用户决定；用户的决定再经主进程和 Session 交到适配器，由适配器回传给子进程；找不到对应订阅者时按拒绝处理。第十一步，子进程报告本轮结束，Session 收到 done，界面恢复可输入。本图省略了：服务端或云端，因为本机任务的一轮不经过 Cindy 服务；手机与 Device Link，那是另一条链路；任何耗时数字；写数据库的具体函数与表结构。</desc>

  <defs>
    <linearGradient id="cindy-seq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="cindy-seq-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <filter id="cindy-seq-shadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="cindy-seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'SF Pro SC', system-ui, sans-serif; }
      .cs-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .cs-sub { fill: #94a3b8; font-size: 12px; }
      .cs-lane { fill: #f8fafc; font-size: 13.5px; font-weight: 700; }
      .cs-hname { fill: #e2e8f0; font-size: 11.5px; font-weight: 600; }
      .cs-hnote { fill: #94a3b8; font-size: 10.5px; }
      .cs-cap { fill: #fdba74; font-size: 11px; font-weight: 600; }
      .cs-note { fill: #cbd5e1; font-size: 10.5px; }
      .cs-num { fill: #0f172a; font-size: 11px; font-weight: 700; }
      .cs-legend { fill: #cbd5e1; font-size: 12px; }
      .cs-solid { fill: none; stroke: #fb923c; stroke-width: 2; }
      .cs-dash { fill: none; stroke: #fb923c; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1020" height="1740" fill="url(#cindy-seq-bg)"/>
  <rect width="1020" height="1740" fill="url(#cindy-seq-grid)"/>

  <!-- 图题 -->
  <rect x="36" y="24" width="8" height="38" rx="4" fill="#fb923c"/>
  <text x="56" y="45" class="cs-title">一次任务请求的完整回路：从界面到 harness，再回到界面</text>
  <text x="56" y="64" class="cs-sub">编号即顺序。只画本机任务的一轮：从界面发出一句话，到 harness 开始执行，再到结果回到界面。</text>

  <!-- 六条竖向泳道（不放生命线） -->
  <g>
    <rect x="26" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="190" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="354" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="518" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="682" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
    <rect x="846" y="118" width="148" height="1547" fill="rgba(15, 23, 42, 0.62)" stroke="rgba(148, 163, 184, 0.22)"/>
  </g>

  <!-- 泳道标题卡片：双层 -->
  <g>
    <rect x="26" y="118" width="148" height="84" rx="9" fill="#0f172a"/>
    <rect x="26" y="118" width="148" height="84" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#22d3ee" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
    <text x="100" y="141" class="cs-lane" text-anchor="middle">界面</text>
    <text x="100" y="163" class="cs-hnote" text-anchor="middle">Renderer</text>
    <text x="100" y="180" class="cs-hnote" text-anchor="middle">发出请求，接收事件与结果</text>

    <rect x="190" y="118" width="148" height="84" rx="9" fill="#0f172a"/>
    <rect x="190" y="118" width="148" height="84" rx="9" fill="rgba(8, 51, 68, 0.45)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
    <text x="264" y="141" class="cs-lane" text-anchor="middle">预加载桥</text>
    <text x="264" y="163" class="cs-hnote" text-anchor="middle">preload</text>
    <text x="264" y="180" class="cs-hnote" text-anchor="middle">界面与主进程之间的桥</text>

    <rect x="354" y="118" width="148" height="84" rx="9" fill="#0f172a"/>
    <rect x="354" y="118" width="148" height="84" rx="9" fill="rgba(76, 29, 149, 0.45)" stroke="#a78bfa" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
    <text x="428" y="141" class="cs-lane" text-anchor="middle">主进程</text>
    <text x="428" y="160" class="cs-hname" text-anchor="middle">IPC 处理器</text>
    <text x="428" y="177" class="cs-hname" text-anchor="middle">输入协调器</text>
    <text x="428" y="192" class="cs-hnote" text-anchor="middle">AgentInputCoordinator</text>

    <rect x="518" y="118" width="148" height="84" rx="9" fill="#0f172a"/>
    <rect x="518" y="118" width="148" height="84" rx="9" fill="rgba(76, 29, 149, 0.45)" stroke="#818cf8" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
    <text x="592" y="141" class="cs-lane" text-anchor="middle">Maker 与 Session</text>
    <text x="592" y="160" class="cs-hnote" text-anchor="middle">同属 maker-core</text>
    <text x="592" y="175" class="cs-hnote" text-anchor="middle">activeSessions</text>
    <text x="592" y="190" class="cs-hnote" text-anchor="middle">dispatchSend</text>

    <rect x="682" y="118" width="148" height="84" rx="9" fill="#0f172a"/>
    <rect x="682" y="118" width="148" height="84" rx="9" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
    <text x="756" y="141" class="cs-lane" text-anchor="middle">harness 适配器</text>
    <text x="756" y="160" class="cs-hnote" text-anchor="middle">ClaudeCodeAgent</text>
    <text x="756" y="175" class="cs-hnote" text-anchor="middle">CodexAgent · PiAgent</text>
    <text x="756" y="190" class="cs-hnote" text-anchor="middle">AgentSessionHandle</text>

    <rect x="846" y="118" width="148" height="84" rx="9" fill="#0f172a"/>

    <text x="920" y="160" class="cs-hnote" text-anchor="middle">claude</text>
    <text x="920" y="175" class="cs-hnote" text-anchor="middle">codex app-server</text>
    <text x="920" y="190" class="cs-hnote" text-anchor="middle">pi（rpc 模式运行）</text>
  </g>

  <!-- 1 界面经 preload 调用 maker:send -->
  <line x1="100" y1="240" x2="258" y2="240" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="118" cy="228" r="9" fill="#22d3ee"/>
  <text x="118" y="232" class="cs-num" text-anchor="middle">1</text>
  <text x="134" y="232" class="cs-cap">调用 maker:send</text>
  <text x="134" y="255" class="cs-note">带 sessionId 与消息</text>

  <line x1="264" y1="288" x2="422" y2="288" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="282" cy="276" r="9" fill="#38bdf8"/>
  <text x="282" y="280" class="cs-num" text-anchor="middle">1</text>
  <text x="298" y="280" class="cs-cap">进入主进程</text>
  <text x="298" y="303" class="cs-note">ipcMain.handle 注册</text>

  <!-- 2 主进程把输入交给输入协调器（自调用） -->
  <text x="360" y="328" class="cs-cap">交给输入协调器</text>
  <path d="M 378 342 H 480 V 362 H 374" class="cs-solid" stroke-linejoin="round" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="369" cy="342" r="9" fill="#a78bfa"/>
  <text x="369" y="346" class="cs-num" text-anchor="middle">2</text>
  <rect x="356" y="370" width="144" height="87" rx="7" fill="#0f172a"/>
  <rect x="356" y="370" width="144" height="87" rx="7" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="428" y="387" class="cs-note" text-anchor="middle">排队、落库</text>
  <text x="428" y="402" class="cs-note" text-anchor="middle">检查这个任务有没有</text>
  <text x="428" y="417" class="cs-note" text-anchor="middle">正在跑的一轮</text>
  <text x="428" y="432" class="cs-note" text-anchor="middle">经 register.ts 的</text>
  <text x="428" y="447" class="cs-note" text-anchor="middle">sendToSessionInternal</text>

  <!-- 3 协调器经 Maker 取到或恢复 Session -->
  <line x1="428" y1="492" x2="586" y2="492" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="446" cy="480" r="9" fill="#a78bfa"/>
  <text x="446" y="484" class="cs-num" text-anchor="middle">3</text>
  <text x="462" y="484" class="cs-cap">取到或恢复 Session</text>
  <text x="462" y="507" class="cs-note">经 Maker</text>
  <text x="462" y="522" class="cs-note">（activeSessions）</text>

  <!-- 4 Session.send 进入 dispatchSend（自调用） -->
  <text x="524" y="549" class="cs-cap">Session.send</text>
  <path d="M 542 563 H 644 V 583 H 538" class="cs-solid" stroke-linejoin="round" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="533" cy="563" r="9" fill="#818cf8"/>
  <text x="533" y="567" class="cs-num" text-anchor="middle">4</text>
  <rect x="520" y="591" width="144" height="57" rx="7" fill="#0f172a"/>
  <rect x="520" y="591" width="144" height="57" rx="7" fill="rgba(76, 29, 149, 0.5)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="592" y="608" class="cs-note" text-anchor="middle">进入 dispatchSend</text>
  <text x="592" y="623" class="cs-note" text-anchor="middle">确认没有在跑的一轮</text>
  <text x="592" y="638" class="cs-note" text-anchor="middle">为本轮预留一个代号</text>

  <!-- 5 Session 调用 handle.send，进入 harness 适配器 -->
  <line x1="592" y1="683" x2="750" y2="683" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="610" cy="671" r="9" fill="#818cf8"/>
  <text x="610" y="675" class="cs-num" text-anchor="middle">5</text>
  <text x="626" y="675" class="cs-cap">调用 handle.send</text>
  <text x="626" y="698" class="cs-note">进入 harness 适配器</text>
  <text x="626" y="713" class="cs-note">AgentSessionHandle</text>

  <!-- 6 适配器翻译成该 harness 的协议，发给子进程 -->
  <rect x="782" y="759" width="154" height="72" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <line x1="756" y1="752" x2="914" y2="752" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="774" cy="740" r="9" fill="#fbbf24"/>
  <text x="774" y="744" class="cs-num" text-anchor="middle">6</text>
  <text x="790" y="744" class="cs-cap">翻译成 harness 协议</text>
  <text x="790" y="776" class="cs-note">发给子进程</text>
  <text x="790" y="791" class="cs-note">Codex：turn/start</text>
  <text x="790" y="806" class="cs-note">Claude Code：SDK query</text>
  <text x="790" y="821" class="cs-note">Pi：RPC</text>

  <!-- 7 子进程执行（自调用） -->
  <text x="852" y="854" class="cs-cap">子进程执行</text>
  <path d="M 870 868 H 972 V 888 H 866" class="cs-solid" stroke-linejoin="round" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="861" cy="868" r="9" fill="#34d399"/>
  <text x="861" y="872" class="cs-num" text-anchor="middle">7</text>
  <rect x="848" y="896" width="144" height="42" rx="7" fill="#0f172a"/>
  <rect x="848" y="896" width="144" height="42" rx="7" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="920" y="913" class="cs-note" text-anchor="middle">调用模型、读写文件</text>
  <text x="920" y="928" class="cs-note" text-anchor="middle">跑命令</text>

  <!-- 8 原始输出回适配器，适配器翻译成统一事件 -->

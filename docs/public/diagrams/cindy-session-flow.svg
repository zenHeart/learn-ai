  <circle cx="396" cy="1122" r="9" fill="#a78bfa"/>
  <text x="396" y="1126" class="cs-num" text-anchor="middle">9</text>
  <text x="380" y="1130" class="cs-cap" text-anchor="end">广播事件回界面</text>
  <circle cx="446" cy="1147" r="9" fill="#a78bfa"/>
  <text x="446" y="1151" class="cs-num" text-anchor="middle">9</text>
  <text x="462" y="1151" class="cs-cap">写入</text>

  <!-- 本地 SQLite 数据库：主进程泳道内的标注框 -->
  <rect x="356" y="1162" width="144" height="46" rx="8" fill="#0f172a"/>
  <rect x="356" y="1162" width="144" height="46" rx="8" fill="rgba(6, 78, 59, 0.5)" stroke="#10b981" stroke-width="1.5" filter="url(#cindy-seq-shadow)"/>
  <text x="428" y="1182" class="cs-lane" text-anchor="middle">本地 SQLite 数据库</text>
  <text x="428" y="1198" class="cs-hnote" text-anchor="middle">（消息落库）</text>

  <!-- 10 interaction_request 停在界面等用户决定，决定由适配器回传子进程 -->
  <line x1="756" y1="1243" x2="598" y2="1243" class="cs-dash" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="742" cy="1231" r="9" fill="#fbbf24"/>
  <text x="742" y="1235" class="cs-num" text-anchor="middle">10</text>
  <text x="728" y="1239" class="cs-cap" text-anchor="end">interaction_request</text>
  <text x="728" y="1258" class="cs-note" text-anchor="end">需要确认的操作</text>

  <line x1="592" y1="1293" x2="434" y2="1293" class="cs-dash" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="578" cy="1281" r="9" fill="#818cf8"/>
  <text x="578" y="1285" class="cs-num" text-anchor="middle">10</text>
  <text x="564" y="1289" class="cs-cap" text-anchor="end">interaction_request</text>

  <rect x="228" y="1304" width="194" height="28" rx="6" fill="#0f172a"/>
  <line x1="428" y1="1327" x2="106" y2="1327" class="cs-dash" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="410" cy="1315" r="9" fill="#a78bfa"/>
  <text x="410" y="1319" class="cs-num" text-anchor="middle">10</text>
  <text x="394" y="1323" class="cs-cap" text-anchor="end">停在界面等用户决定</text>

  <rect x="104" y="1338" width="130" height="28" rx="6" fill="#0f172a"/>
  <line x1="100" y1="1361" x2="422" y2="1361" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="118" cy="1349" r="9" fill="#22d3ee"/>
  <text x="118" y="1353" class="cs-num" text-anchor="middle">10</text>

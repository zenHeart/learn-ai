  <line x1="428" y1="1395" x2="586" y2="1395" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="446" cy="1383" r="9" fill="#a78bfa"/>
  <text x="446" y="1387" class="cs-num" text-anchor="middle">10</text>
  <text x="462" y="1387" class="cs-cap">决定送往 Session</text>


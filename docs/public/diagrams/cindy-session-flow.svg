  <circle cx="610" cy="1417" r="9" fill="#818cf8"/>
  <text x="610" y="1421" class="cs-num" text-anchor="middle">10</text>
  <text x="626" y="1421" class="cs-cap">决定交给适配器</text>

  <line x1="756" y1="1463" x2="914" y2="1463" class="cs-solid" marker-end="url(#cindy-seq-arrow)"/>
  <circle cx="774" cy="1451" r="9" fill="#fbbf24"/>
  <text x="774" y="1455" class="cs-num" text-anchor="middle">10</text>

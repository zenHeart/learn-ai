<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%" role="img" aria-labelledby="flow-pipeline-title flow-pipeline-desc">
  <title id="flow-pipeline-title">Google Flow: from a sentence or a reference image to a clip on the timeline</title>
  <desc id="flow-pipeline-desc">This diagram runs left to right in four stages and answers one question: when you type a sentence or supply a reference image, which model takes it, and how does it become a clip on the timeline? Stage 1 is input, three things: the text prompt, frames (a start frame and an end frame), and ingredients (characters, scenes, objects). Stage 2 is the models. There are two video models, Omni Flash from Gemini Omni and Veo 3.1 Lite from Veo 3.1. They generate and edit video and support conversational iteration, and every generation spends credits, counted per second or per generation. The image models are the Nano Banana family (Pro, 2.1, 2 Lite). They generate and edit images, spend no credits, and follow a daily cap instead. Stage 3 is output: the video models produce candidate clips, and the image models produce images. Stage 4 is the finished film, which is the Scenebuilder timeline. There are six sets of connections. First, the text prompt goes straight into the video models. Second, frames and ingredients can enter the video models together with the same generation. Third, the video models produce candidate clips, and the image models produce images. Fourth, the arrow from candidate clips to Scenebuilder is labelled Add to Scene: only the candidates you pick enter the timeline; the ones you do not pick never do. Fifth, a dashed line along the bottom runs left from the output images back to the input: a generated image can be reused as the start frame, end frame, or ingredient of a later video generation. Sixth, the two-headed dashed line along the top, between the models and Scenebuilder, is Extend: it goes from the end of an existing clip back to the video models, and the continuation it generates returns to the timeline. Inside Scenebuilder, clips sit in order; you can drag them into a different order and trim their start and end. This diagram leaves out which models support which generation mode, because one mode is usually supported by several models, so input is not drawn as one-to-one with any model. It also leaves out specific credit amounts, API call paths, and Flow Music, whose credit system is separate.</desc>

  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="flowGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <filter id="flowShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'SF Pro SC', system-ui, sans-serif; }
      .t-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .t-sub { fill: #94a3b8; font-size: 12px; }
      .t-band { fill: #f8fafc; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      .t-note { fill: #94a3b8; font-size: 10.5px; }
      .t-card { fill: #f8fafc; font-size: 13.5px; font-weight: 700; }
      .t-body { fill: #cbd5e1; font-size: 11px; }
      .t-code { fill: #7dd3fc; font-size: 10.5px; }
      .t-cap { fill: #fdba74; font-size: 10.5px; font-weight: 600; }
      .t-num { fill: #0f172a; font-size: 11px; font-weight: 700; }
      .t-badge-amber { fill: #fde68a; font-size: 10.5px; font-weight: 600; }
      .t-badge-green { fill: #a7f3d0; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1080" height="560" fill="url(#flowBg)"/>
  <rect width="1080" height="560" fill="url(#flowGrid)"/>

  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="8" height="38" rx="4" fill="#fb923c"/>
    <text x="20" y="21" class="t-title">One generation in Flow: from input to the timeline</text>
    <text x="20" y="40" class="t-sub">Solid orange lines are the main path of one generation; dashed lines are reuse and Extend. Credits are spent only at the video-model layer</text>
  </g>

  <!-- Column headers -->
  <circle cx="41" cy="100" r="11" fill="#38bdf8"/>
  <text x="41" y="104.5" class="t-num" text-anchor="middle">1</text>
  <text x="62" y="104.5" class="t-band">Input</text>
  <text x="118" y="104.5" class="t-note">what you give</text>
  <circle cx="311" cy="100" r="11" fill="#a78bfa"/>
  <text x="311" y="104.5" class="t-num" text-anchor="middle">2</text>
  <text x="332" y="104.5" class="t-band">Models</text>
  <text x="396" y="104.5" class="t-note">who takes over</text>
  <circle cx="621" cy="100" r="11" fill="#34d399"/>
  <text x="621" y="104.5" class="t-num" text-anchor="middle">3</text>
  <text x="642" y="104.5" class="t-band">Outputs</text>
  <text x="712" y="104.5" class="t-note">what a run returns</text>
  <circle cx="891" cy="100" r="11" fill="#94a3b8"/>
  <text x="891" y="104.5" class="t-num" text-anchor="middle">4</text>
  <text x="912" y="104.5" class="t-band">Film</text>
  <text x="962" y="104.5" class="t-note">you arrange</text>

  <!-- Top channel: Extend goes from a clip's end to the video models and back -->
  <path d="M 965 152 V 132 H 420 V 146" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#flowArrow)" marker-end="url(#flowArrow)"/>
  <rect x="505" y="123" width="350" height="18" fill="#0f172a"/>
  <text x="680" y="136" class="t-cap" text-anchor="middle">Extend: back to the video model, then back to the timeline</text>

  <!-- Connections, drawn before the cards; endpoints sit on card edges -->
  <line x1="210" y1="182" x2="292" y2="182" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text x="251" y="174" class="t-cap" text-anchor="middle">straight in</text>
  <path d="M 210 267 H 240 V 236 H 292" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M 210 357 H 262 V 254 H 292" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text x="216" y="373" class="t-cap">same run</text>
  <line x1="540" y1="196" x2="602" y2="196" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="540" y1="357" x2="602" y2="357" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="790" y1="196" x2="872" y2="196" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text x="831" y="188" class="t-cap" text-anchor="middle">Add to Scene</text>
  <text x="831" y="213" class="t-cap" text-anchor="middle">only your picks</text>

  <!-- Bottom channel: an output image returns as input for the next generation -->
  <path d="M 700 392 V 422 H 120 V 398" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flowArrow)"/>
  <text x="410" y="416" class="t-cap" text-anchor="middle">Generated images can become a start frame, end frame or ingredient</text>

  <!-- 1 Input -->
  <g transform="translate(30, 0)">
    <rect x="0" y="152" width="180" height="60" rx="9" fill="#0f172a"/>
    <rect x="0" y="152" width="180" height="60" rx="9" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="90" y="178" class="t-card" text-anchor="middle">Text prompt</text>
    <text x="90" y="198" class="t-code" text-anchor="middle">what you type</text>
    <rect x="0" y="232" width="180" height="70" rx="9" fill="#0f172a"/>
    <rect x="0" y="232" width="180" height="70" rx="9" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="90" y="256" class="t-card" text-anchor="middle">Frames</text>
    <text x="90" y="274" class="t-code" text-anchor="middle">start frame / end frame</text>
    <text x="90" y="290" class="t-note" text-anchor="middle">first and last image</text>
    <rect x="0" y="322" width="180" height="70" rx="9" fill="#0f172a"/>
    <rect x="0" y="322" width="180" height="70" rx="9" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="90" y="346" class="t-card" text-anchor="middle">Ingredients</text>
    <text x="90" y="364" class="t-note" text-anchor="middle">characters, scenes,</text>
    <text x="90" y="380" class="t-note" text-anchor="middle">objects</text>
  </g>

  <!-- 2 Models -->
  <g transform="translate(300, 0)">
    <rect x="0" y="152" width="240" height="120" rx="9" fill="#0f172a"/>
    <rect x="0" y="152" width="240" height="120" rx="9" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="120" y="178" class="t-card" text-anchor="middle">Video models</text>
    <text x="120" y="200" class="t-body" text-anchor="middle">Gemini Omni · Omni Flash</text>
    <text x="120" y="218" class="t-body" text-anchor="middle">Veo 3.1 · Veo 3.1 Lite</text>
    <rect x="12" y="233" width="216" height="26" rx="13" fill="#0f172a"/>
    <rect x="12" y="233" width="216" height="26" rx="13" fill="rgba(120, 53, 15, 0.45)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="120" y="250" class="t-badge-amber" text-anchor="middle">Every generation spends credits</text>
    <rect x="0" y="322" width="240" height="70" rx="9" fill="#0f172a"/>
    <rect x="0" y="322" width="240" height="70" rx="9" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="120" y="342" class="t-card" text-anchor="middle">Image models</text>
    <text x="120" y="359" class="t-body" text-anchor="middle">Nano Banana · Pro / 2.1 / 2 Lite</text>
    <rect x="45" y="365" width="150" height="22" rx="11" fill="#0f172a"/>
    <rect x="45" y="365" width="150" height="22" rx="11" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.2"/>
    <text x="120" y="380" class="t-badge-green" text-anchor="middle">No credits; daily cap</text>
  </g>

  <!-- 3 Outputs -->
  <g transform="translate(610, 0)">
    <rect x="0" y="152" width="180" height="120" rx="9" fill="#0f172a"/>
    <rect x="0" y="152" width="180" height="120" rx="9" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="90" y="186" class="t-card" text-anchor="middle">Candidate clips</text>
    <text x="90" y="206" class="t-code" text-anchor="middle">generation / output</text>
    <text x="90" y="228" class="t-note" text-anchor="middle">Each run makes several</text>
    <text x="90" y="246" class="t-note" text-anchor="middle">Only your picks move on</text>
    <rect x="0" y="322" width="180" height="70" rx="9" fill="#0f172a"/>
    <rect x="0" y="322" width="180" height="70" rx="9" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="90" y="346" class="t-card" text-anchor="middle">Images</text>
    <text x="90" y="364" class="t-note" text-anchor="middle">can be reused as a</text>
    <text x="90" y="380" class="t-note" text-anchor="middle">frame or ingredient</text>
  </g>

  <!-- 4 Film: the Scenebuilder timeline -->
  <g transform="translate(880, 0)">
    <rect x="0" y="152" width="170" height="240" rx="9" fill="#0f172a"/>
    <rect x="0" y="152" width="170" height="240" rx="9" fill="rgba(30, 41, 59, 0.55)" stroke="#94a3b8" stroke-width="1.5" filter="url(#flowShadow)"/>
    <text x="85" y="174" class="t-card" text-anchor="middle">Scenebuilder</text>
    <text x="85" y="190" class="t-code" text-anchor="middle">timeline</text>
    <rect x="14" y="200" width="40" height="36" rx="5" fill="#0f172a"/>
    <rect x="14" y="200" width="40" height="36" rx="5" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.2"/>
    <text x="34" y="223" class="t-body" text-anchor="middle">Clip 1</text>
    <rect x="60" y="200" width="40" height="36" rx="5" fill="#0f172a"/>
    <rect x="60" y="200" width="40" height="36" rx="5" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.2"/>
    <text x="80" y="223" class="t-body" text-anchor="middle">Clip 2</text>
    <rect x="106" y="200" width="40" height="36" rx="5" fill="#0f172a"/>
    <rect x="106" y="200" width="40" height="36" rx="5" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.2"/>
    <text x="126" y="223" class="t-body" text-anchor="middle">Clip 3</text>
    <text x="85" y="262" class="t-note" text-anchor="middle">Clips play in order</text>
    <text x="85" y="282" class="t-note" text-anchor="middle">drag to reorder</text>
    <text x="85" y="300" class="t-note" text-anchor="middle">trim start and end</text>
    <line x1="14" y1="316" x2="156" y2="316" stroke="#334155" stroke-width="1"/>
    <text x="85" y="340" class="t-body" text-anchor="middle">scene: the finished film</text>
  </g>

  <!-- Legend -->
  <text x="36" y="470" class="t-note">Legend</text>
  <line x1="36" y1="478" x2="1044" y2="478" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="498" x2="76" y2="498" stroke="#fb923c" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text x="86" y="502" class="t-note">Solid arrow: main path of one generation</text>
  <line x1="330" y1="498" x2="370" y2="498" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flowArrow)"/>
  <text x="380" y="502" class="t-note">Dashed arrow: an image reused as input</text>
  <line x1="660" y1="498" x2="700" y2="498" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#flowArrow)" marker-end="url(#flowArrow)"/>
  <text x="710" y="502" class="t-note">Two-headed dashed: Extend goes and returns</text>
  <rect x="36" y="521" width="16" height="12" rx="3" fill="rgba(8, 51, 68, 0.6)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="60" y="531" class="t-note">Input</text>
  <rect x="136" y="521" width="16" height="12" rx="3" fill="rgba(76, 29, 149, 0.6)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="160" y="531" class="t-note">Models</text>
  <rect x="236" y="521" width="16" height="12" rx="3" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.2"/>
  <text x="260" y="531" class="t-note">Outputs</text>
  <rect x="336" y="521" width="16" height="12" rx="3" fill="rgba(30, 41, 59, 0.7)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="360" y="531" class="t-note">Film</text>
  <rect x="436" y="521" width="16" height="12" rx="3" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="460" y="531" class="t-note">Spends credits</text>
  <rect x="566" y="521" width="16" height="12" rx="3" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.2"/>
  <text x="590" y="531" class="t-note">No credits; daily cap</text>
</svg>
